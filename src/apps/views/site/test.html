<script>
document.addEventListener("DOMContentLoaded", function () {

  // 1. Tìm kiếm và gợi ý sản phẩm
  const searchInput = document.getElementById('search-input');
  const suggestionsBox = document.getElementById('search-suggestions');
  
  if (searchInput && suggestionsBox) {
    let timeoutId = null;

    searchInput.addEventListener('input', function() {
      const keyword = this.value.trim();

      // Xóa timeout cũ để tránh gọi API liên tục mỗi khi gõ phím (Debounce)
      clearTimeout(timeoutId);

      if (keyword.length === 0) {
        suggestionsBox.innerHTML = '';
        suggestionsBox.classList.add('hidden');
        return;
      }

      // Đợi 300ms sau khi người dùng ngừng gõ mới gọi API
      timeoutId = setTimeout(() => {
        fetch(`/api/search-suggestions?keyword=${encodeURIComponent(keyword)}`)
          .then(response => response.json())
          .then(data => {
            if (data.length > 0) {
              let html = '';
              data.forEach(item => {
                // Lấy ảnh đầu tiên hoặc ảnh mặc định
                let imgSrc = (item.image && item.image.length > 0) ? item.image[0].images : 'default.webp';
                
                html += `
                  <a href="/product?san-pham=${item.slug}&id=${item._id}" class="flex items-center gap-3 p-2 hover:bg-slate-50 transition border-b border-slate-100 last:border-none">
                    <img src="../site/images/update/${imgSrc}" alt="${item.name}" class=" h-10 object-cover rounded">
                    <div class="flex-1 min-w-0">
                      <p class="text-xs font-medium text-slate-800 truncate">${item.name}</p>
                      <p class="text-xs text-blue-600 font-semibold">${Number(item.sale).toLocaleString()} đ</p>
                    </div>
                  </a>
                `;
              });
              suggestionsBox.innerHTML = html;
              suggestionsBox.classList.remove('hidden');
            } else {
              suggestionsBox.innerHTML = `<div class="p-3 text-xs text-slate-500 text-center">Không tìm thấy sản phẩm phù hợp</div>`;
              suggestionsBox.classList.remove('hidden');
            }
          })
          .catch(err => console.error(err));
      }, 300);
    });

    // Ẩn khung gợi ý khi click ra ngoài ô tìm kiếm
    document.addEventListener('click', function(e) { 
      if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
        suggestionsBox.classList.add('hidden');
      }
    });
  }


  // 2. Xử lý mở/đóng danh mục Sản phẩm trên mobile
  const mobileProductToggle = document.getElementById('mobile-product-toggle');
  const mobileProductDropdown = document.getElementById('mobile-product-dropdown');
  const productChevron = document.getElementById('product-chevron');

  if (mobileProductToggle && mobileProductDropdown && productChevron) {
    mobileProductToggle.addEventListener('click', () => {
      mobileProductDropdown.classList.toggle('hidden');
      productChevron.classList.toggle('rotate-180');
    });
  }


  // 3. Xử lý Menu mobile (Hamburger menu)
  const mobileMenuButton = document.getElementById('mobile-menu-button');
  const mobileMenu = document.getElementById('mobile-menu');
  const menuIcon = document.getElementById('menu-icon');

  if (mobileMenuButton && mobileMenu && menuIcon) {
    mobileMenuButton.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
      // Chuyển đổi giữa icon 3 gạch (fa-bars) và dấu X (fa-xmark)
      if (mobileMenu.classList.contains('hidden')) {
        menuIcon.classList.remove('fa-xmark');
        menuIcon.classList.add('fa-bars');
      } else {
        menuIcon.classList.remove('fa-bars');
        menuIcon.classList.add('fa-xmark');
      }
    });
  }


  // 4. Các hàm và sự kiện giỏ hàng, thông báo Toast
  // Hàm tạo và hiển thị hiệu ứng thông báo thả rơi động (hỗ trợ xếp chồng khi bấm liên tục)
  function showToast(message = "Thêm vào giỏ hàng thành công!") {
      // 1. Tạo phần tử toast mới
      const toast = document.createElement("div");
      toast.className = "dynamic-toast-item";
      toast.innerHTML = `<i class="fa-solid fa-check-circle"></i> ${message}`;

      // 2. Định nghĩa style trực tiếp cho thông báo động
      Object.assign(toast.style, {
          position: "fixed",
          top: "-60px",
          right: "20px",
          backgroundColor: "#10B981",
          color: "white",
          padding: "12px 20px",
          borderRadius: "8px",
          boxShadow: "0 4px 12px rgba(0,0,0,0.15)",
          zIndex: "9999",
          fontWeight: "bold",
          transition: "all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55)",
          opacity: "0"
      });

      // 3. Đưa thông báo vào body của trang
      document.body.appendChild(toast);

      // 4. Tính toán vị trí xếp chồng nếu đang có các toast khác hiển thị trên màn hình
      const existingToasts = document.querySelectorAll(".dynamic-toast-item");
      let topPosition = 20; // Vị trí mặc định cách đỉnh 20px
      
      existingToasts.forEach(t => {
          if (t !== toast) {
              // Lấy khoảng cách top hiện tại của các toast cũ và cộng dồn chiều cao để xếp chồng xuống dưới
              const currentTop = parseInt(t.style.top) || 20;
              topPosition = Math.max(topPosition, currentTop + t.offsetHeight + 10);
          }
      });

      // 5. Kích hoạt hiệu ứng rơi xuống
      requestAnimationFrame(() => {
          toast.style.opacity = "1";
          toast.style.top = `${topPosition}px`;
      });

      // 6. Sau 3 giây thì trượt ngược lên trên và tự hủy khỏi DOM
      setTimeout(() => {
          toast.style.top = "-60px";
          toast.style.opacity = "0";
          setTimeout(() => {
              toast.remove(); // Xóa hẳn phần tử khỏi HTML
          }, 400); // Khớp với thời gian transition 0.4s
      }, 3000);
  }

  // Hàm chung xử lý AJAX gọi lên server thêm vào giỏ hàng
  function handleAddToCart(form) {
      const formData = new FormData(form);

      fetch(form.action, {
          method: 'POST',
          body: formData,
          headers: {
              'Accept': 'application/json'
          }
      })
      .then(response => response.json())
      .then(data => {
          if (data.success) {
              // Cập nhật số lượng giỏ hàng trên header
              const cartBadge = document.getElementById("cart-badge-count");
              if (cartBadge) {
                  cartBadge.textContent = data.totalQty;
              }

              // Gọi hàm hiển thị thông báo thả rơi động
              showToast("Thêm vào giỏ hàng thành công!");

          } else {
              alert("Có lỗi xảy ra khi thêm vào giỏ hàng!");
          }
      })
      .catch(error => {
          console.error("Lỗi:", error);
          alert("Không thể kết nối đến máy chủ.");
      });
  }

  // --- BẮT SỰ KIỆN CÁC NÚT BẤM ---

  // 1. Trang chi tiết sản phẩm (Nút chọn màu và nút thêm to)
  const colorButtons = document.querySelectorAll(".color-options .color-btn");
  const hiddenInput = document.getElementById("selected-anhsang");
  const productForm = document.getElementById("product-form");
  const btnAddToCart = document.getElementById("btn-add-to-cart");

  if (colorButtons.length > 0 && hiddenInput) {
      colorButtons.forEach(button => {
          button.addEventListener("click", function () {
              colorButtons.forEach(btn => btn.classList.remove("active"));
              this.classList.add("active");
              hiddenInput.value = this.getAttribute("data-color");
          });
      });
  }

  if (btnAddToCart && productForm) {
      btnAddToCart.addEventListener("click", function () {
          handleAddToCart(productForm);
      });
  }

  // 2. Trang danh sách sản phẩm (Các nút icon giỏ hàng nhỏ trong card)
  const ajaxForms = document.querySelectorAll(".ajax-cart-form");
  ajaxForms.forEach(form => {
      const btn = form.querySelector(".btn-add-ajax");
      if (btn) {
          btn.addEventListener("click", function () {
              handleAddToCart(form);
          });
      }
  });

});
</script>
